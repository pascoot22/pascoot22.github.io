  <div id="encode" class="main-content">
    <p>Hashing, use this to generate a sha-256 hash</p>
    <input type="text" id="message"></input>
    <button onclick="hashString()">Encode</button>
  </div>
  

  <p id="success"></p>
  
<script>
  const counter = window.crypto.getRandomValues(new Uint8Array(16));

  async function hashString() {
    const str = document.getElementById('message').value;
    const buffer = new TextEncoder().encode(str);
    const hashBuffer = await crypto.subtle.digest('SHA-256', buffer);
    const ans = Array.from(new Uint8Array(hashBuffer))
      .map(b => b.toString(16).padStart(2, '0'))
      .join('');
    document.getElementById('success').textContent = ans;
  }

  async function encrypt() {
    const message = document.getElementById('message').value;
    const key = document.getElementById('key').value;
    const buffer = new TextEncoder().encode(str);
    
    const hashBuffer = await window.crypto.subtle.encrypt({
      name: "AES-CTR",
      counter,
      length: 64,
    },
    key,
    buffer,
  );
    const ans = Array.from(new Uint8Array(hashBuffer))
      .map(b => b.toString(16).padStart(2, '0'))
      .join('');
    document.getElementById('success').textContent = ans;
  }

  async function decrypt() {
    const message = document.getElementById('message').value;
    const key = document.getElementById('key').value;
    const buffer = new TextEncoder().encode(str);
    return window.crypto.subtle.decrypt(
    { name: "AES-CTR", counter, length: 64 },
    key,
    buffer,
  );
  }



</script>
