<!DOCTYPE html>
<html lang="en">
<head>
    <title>Patrick Scott</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://code.jquery.com/jquery-4.0.0.js"></script>
  </head>
  <body>
    
    <ol id="nav"></ol>
  
    <script>
      $( "#nav" ).load( "nav.html" );
    </script>

  <div id="password" class="main-content">
    <p>Guess the password</p>
    <input type="password" id="guess"></input>
    <button onclick="checkpw()">Guess</button>
  </div>
  

  <div id="numguess" class="main-content">
    <p>Guess the three numbers</p>
    <input id="guessnum"></input>
    <button onclick="checknum()">Guess</button>
    <button onclick="reset()">Reset</button>
    <div id="guesses"></div>
  </div>
  
<script>

const CORRECT_HASH = "5e884898da28047151d0e56f8dc6292773603d0d6aabbdd62a11ef721d1542d8";
num =  Math.floor(Math.random() * 1000).toString().padStart(3, '0');
guesses = 0;
const container = document.getElementById('guesses');

  async function hashString(str) {
    const buffer = new TextEncoder().encode(str);
    const hashBuffer = await crypto.subtle.digest('SHA-256', buffer);
    return Array.from(new Uint8Array(hashBuffer))
      .map(b => b.toString(16).padStart(2, '0'))
      .join('');
  }

  async function checkpw() {
    const input = document.getElementById('guess').value;
    const hash = await hashString(input);
    
    if (hash === CORRECT_HASH) {
      document.getElementById('numguess').style.display = 'block';
      document.getElementById('password').style.display = 'none';
    } else {
      alert('Incorrect password');
    }
  }

  async function checknum() {
    // 1 check length of guess
    // 2 check accuracy of guess
    // 3 check number of guesses
    // 4 display content
    const guess = document.getElementById('guessnum').value;
    let isnum = /^\d\d\d$/.test(guess);
    if (!isnum){
      alert('No, must be 3 numbers');
      return;
    }
    guesses += 1;
    if (guesses > 8){
      
    }
    alert('sure');
    const newPara = document.createElement('p');
    newPara.textContent = "Guess " + guesses + ":" + guess;
    container.appendChild(newPara);
  }

  async function reset() {
    num = Math.floor(Math.random() * 1000).toString().padStart(3, '0');
    guesses = 0;
    container.innerHTML='';
  }

</script>
</body>
</html>
